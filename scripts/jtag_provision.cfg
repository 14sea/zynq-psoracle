# OpenOCD chain for KEY PROVISIONING over the DAP mem-AP (docs/decisions.md D4 option A).
#
# Same pod and TAP order as jtag_config_only.cfg (FT4232H, PL TAP first), plus the DAP and a
# single `mem_ap` target on AP 0 (the AHB-AP into the PS interconnect → AXI GP0 → the P3
# carrier's register window). NO cortex_a targets: nothing is halted, nothing is polled,
# the console session is untouched. This is the path the workspace notes proved safe under
# U-Boot ("zynq.ahb mdw ... never wedges the CPU").
#
# Access to the pod device node is restricted by udev to the signer's group (host/principal/).

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0008 0x000b

reset_config none
adapter speed 1000

jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 -expected-id 0x13722093
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477

dap create zynq.dap -chain-position zynq.cpu
target create zynq.ahb mem_ap -dap zynq.dap -ap-num 0
